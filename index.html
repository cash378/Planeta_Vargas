<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">

<title>Aula Inclusiva y Divertida</title>
<style>
:root{--bg:#fff;--card:#fff;--ink:#3a1420;--p:#7b1e3a;--g:#7b1e3a;--line:#d9a9b6;--tint:#fbeef1;--rule:#f3dbe2;--h:#7b1e3a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#2a0f1a;--card:#3b1727;--ink:#fbeef0;--line:#7a3550;--p:#b83b5e;--g:#b83b5e;--tint:#4a1d30;--rule:#35182a;--h:#f4b6c8}

*{box-sizing:border-box}
body{margin:0;background-color:var(--bg);background-image:linear-gradient(90deg,transparent 19px,var(--p) 19px,var(--p) 21px,transparent 21px),linear-gradient(var(--rule) 1px,transparent 1px);background-size:100% 100%,100% 34px;color:var(--ink);font:600 clamp(18px,2.4vw,23px)/1.5 Verdana,"Trebuchet MS",sans-serif;letter-spacing:.03em}

h1{display:inline-block;margin:6px 0 0;font-size:clamp(24px,5vw,42px);line-height:1.15;background:#fff;color:var(--p);padding:8px 24px;border-radius:10px;outline:3px dashed var(--p);outline-offset:-9px}
header p{margin:10px 0 0;font-size:.75em}
#mh{border:4px solid #fff;box-shadow:none}
h2{display:inline-block;margin:.5em 0 .3em;color:var(--h);background:linear-gradient(transparent 60%,var(--tint) 60%);padding:0 6px}
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:16px 12px 4px}
button{font:inherit;cursor:pointer;border:3px solid var(--p);border-radius:12px;background:var(--card);color:var(--ink);padding:12px 18px;min-height:56px;margin:4px;box-shadow:4px 4px 0 var(--p);transition:transform .08s,box-shadow .08s}
button:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--p)}

button:focus-visible,summary:focus-visible,a.b:focus-visible,input:focus-visible{outline:5px solid var(--h);outline-offset:3px}
button[aria-pressed=true]{background:var(--p);color:#fff}
.bar button{font-size:.8em;min-height:48px;margin:0;padding:8px 14px}
main{max-width:960px;margin:auto;padding:14px 16px 40px 36px}
.card{background:var(--card);border-radius:8px;padding:22px;border:3px solid var(--p);box-shadow:7px 7px 0 var(--p);outline:2px dashed var(--line);outline-offset:-12px;text-align:center;margin:18px 7px 24px 0}

.grid .tile{margin:0}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;border-radius:14px;background:var(--p);color:#fff;box-shadow:5px 5px 0 var(--line)}
.tile:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--line)}

.mod{display:grid;grid-template-columns:repeat(var(--c),1fr);max-width:200px;margin:8px auto;font-size:1.4em;background:var(--tint);border-radius:10px}
.ok{background:var(--g)!important;color:#fff!important;border-color:var(--g)!important}
.no{opacity:.45}
.fb{min-height:2em;font-size:1.25em}
.en{font-size:clamp(34px,8vw,60px);font-weight:700;color:var(--h);min-height:1.3em;letter-spacing:.06em}
.bub{display:flex;align-items:center;gap:12px;justify-content:center;background:var(--tint);border:3px solid var(--p);border-radius:8px 28px 28px 28px;padding:12px 18px;margin:14px 7px 14px 0}
.bub span{font-size:2.4em;line-height:1}
.bub p{margin:0}
.rd{display:grid;grid-template-columns:repeat(var(--c),1fr);max-width:420px;margin:16px auto;border:4px solid var(--p);border-radius:10px;overflow:hidden;background:var(--card);box-shadow:5px 5px 0 var(--line)}
.rd span{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:clamp(20px,6vw,38px);border:1px dashed var(--line)}

.float{animation:fl 6s ease-in-out infinite}
@keyframes br{50%{transform:scale(1.5)}}
@keyframes fl{50%{transform:translateY(-8px)}}
:root[data-calm] .bc,:root[data-calm] .float,:root[data-hc] .float{animation:none}
@media(prefers-reduced-motion:reduce){.bc,.float{animation:none}}
details{background:var(--card);border:3px solid var(--p);border-radius:8px;box-shadow:5px 5px 0 var(--line);padding:12px 18px;margin:14px 7px 14px 0;text-align:left}
summary{cursor:pointer;font-size:1.1em;color:var(--h)}
li{margin:6px 0}
a.b{display:inline-block;background:var(--p);color:#fff;border:3px solid var(--p);border-radius:12px;padding:14px 22px;min-height:56px;margin:4px;text-decoration:none;box-shadow:4px 4px 0 var(--line)}
footer{text-align:center;font-size:.75em;padding:18px 16px;background:var(--p);color:#fff;border-top:6px double #fff}
@media print{body{background:none}.bar,button,header,footer{display:none}}
.fl li{font-size:1.5em;margin:14px 0}
details td{border:2px solid var(--line);padding:6px}
</style></head><body>
<header><button id="mh" class="float" onclick="go('mascota')" aria-label="Elegir mi mascota" style="font-size:2em;background:#fff;border-radius:50%;min-height:0;padding:6px 14px">🦉</button>

<script>
const $=s=>document.querySelector(s),R=a=>a[Math.floor(Math.random()*a.length)],rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),sh=a=>[...a].sort(()=>Math.random()-.5);
let lvl=1,audio=true,cur=null,fr=null,q=null,stars=0,bi,ac,mo;
const S={};try{Object.assign(S,JSON.parse(localStorage.getItem('aid')||'{}'))}catch(e){}

if(SEC!='A'&&SEC!='B')SEC='';

function fallo(){err++;ER[cur]=(ER[cur]||0)+1;try{localStorage.setItem('aide',JSON.stringify(ER))}catch(e){}}
function textoAvance(){const pl=n=>n+' '+(n==1?'error':'errores'),T=Object.values(ER).reduce((s,v)=>s+v,0),L=[...AP,...JG,AC.emociones].filter(a=>S[a[0]]||ER[a[0]]).map(a=>'• '+a[2]+': '+(S[a[0]]||0)+' aciertos, '+pl(ER[a[0]]||0)),U=HIS.slice(-5).map(r=>'• '+AC[r.a][2]+': '+r.e+' de '+r.t+' estrellas'+(r.x==null?'':', '+pl(r.x)));return 'Aula Inclusiva y Divertida\nEstudiante: '+(NM||'Sin nombre')+'\nSección: '+(SEC||'-')+'\nTotal de equivocaciones: '+T+'\n\nÚltimas rondas:\n'+(U.join('\n')||'Sin rondas todavía.')+'\n\nAciertos y errores por actividad:\n'+(L.join('\n')||'Sin actividades todavía.')}
function enlace(t){const d=TEL.replace(/\D/g,''),e=encodeURIComponent(t);return TEL.includes('@')?'mailto:'+TEL+'?subject='+encodeURIComponent('Aula Inclusiva: progreso')+'&body='+e:d.length>=8?'https://wa.me/'+d+'?text='+e:''}
function setSec(s){SEC=s;try{localStorage.setItem('aids',s)}catch(e){}$('#bs').textContent='🏫 Sección '+s;go('inicio')}
const MA=[['🦉','Búho',.8,.9,'¡Hola!'],['🐘','Elefante',.7,.9,'¡Hola!'],['🐢','Tortuga',.9,.8,'¡Hola!'],['🦋','Mariposa',1.3,1,'¡Hola!'],['🐶','Perrito',1.15,1,'¡Hola!'],['🐱','Gatito',1.25,.95,'¡Hola!'],['🦁','León',.75,.9,'¡Hola!'],['🐰','Conejo',1.3,1.05,'¡Hola!'],['🐬','Delfín',1.1,1,'¡Hola!'],['🦜','Loro',1.2,1.05,'¡Hola!']];

let sk=0;function say(t,L){if(!audio||!window.speechSynthesis)return;const k=++sk,w=speechSynthesis.speaking||speechSynthesis.pending;if(w)speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(t).replace(/\p{Extended_Pictographic}|\uFE0F|\u200D/gu,''));u.lang=L=='en'?'en-US':'es-VE';const i=Math.max(0,MA.findIndex(x=>x[0]==M)),m=MA[i],vs=speechSynthesis.getVoices().filter(v=>(L=='en'?/^en/i:/^es/i).test(v.lang)).sort((a,b)=>a.name<b.name?-1:1);if(vs.length){u.voice=vs[i%vs.length];u.lang=u.voice.lang}u.pitch=m[2];u.rate=.85*m[3];w?setTimeout(()=>{if(k==sk)speechSynthesis.speak(u)},90):speechSynthesis.speak(u)}

const PE=['🐶','🐱','🐰','🐢','🦋','🐟'],PZ=['☁️','🌞','🐦','🌳','🏠','🌷','🍀','🐶','🐛'];
const pw=l=>{const w=R(l);return{p:'¿Cómo se llama?',big:w[1],o:opts(w[0],l.map(x=>x[0]),N()),a:w[0]}};
const G={

sumas:()=>{const m=[5,10,20][lvl-1],s=lvl==1||Math.random()<.5;let a=rnd(1,m),b=rnd(1,m);if(!s&&b>a)[a,b]=[b,a];const r=s?a+b:a-b;return{p:a+(s?' más ':' menos ')+b+', ¿cuánto es?',big:lvl==1?'🍎'.repeat(a)+' ➕ '+'🍎'.repeat(b):a+(s?' + ':' − ')+b,o:near(r),a:String(r)}},
formas:()=>pw(Math.random()<.5?FG:CL),animales:()=>pw(AN),cuerpo:()=>pw(BD),emociones:()=>pw(EMQ),asociar:()=>pw(AN.concat(BD)),
ingles:()=>{const l=R([EA,EC,EF,EN].slice(0,lvl+1)),w=R(l);return{p:'¿Cómo se dice en inglés?',big:w[1],o:opts(w[0],l.map(x=>x[0]),Math.min(5,N())),a:w[0],en:w[0]}},
ingles2:()=>{const l=R([EA,EC,EF,EN].slice(0,lvl+1)),w=R(l);return{p:'Escucha en inglés y toca el dibujo',big:'🔊',o:opts(w[1],l.map(x=>x[1]),Math.min(5,N())),a:w[1],s:w[0],l:'en',en:w[0]}},

function memo(){if(ex>=RN())return fin();ex++;say('Encuentra las parejas. Sin prisa.');const n=lvl+2,e=sh(PE).slice(0,n);let open=[],done=0,lock=0;$('#main').innerHTML=`<button onclick="back()">⬅️ Volver</button><div class="card"><h2>🃏 Memoria</h2><div class="bub"><span>${M}</span><p>Encuentra las parejas. Sin prisa.</p></div><button onclick="say('Encuentra las parejas. Sin prisa.')" aria-label="Escuchar">🔊</button><div class="opts g" style="--c:${[3,4,5][lvl-1]}" id="mb"></div><div class="fb" id="fb" aria-live="polite"></div><button onclick="memo()">${ex<RN()?'Siguiente ➡️':'Terminar 🎉'}</button><p>Ejercicio ${ex} de ${RN()} · <span id="st">${bar()}</span></p></div>`;

function carro(){if(ex>=RN())return fin();ex++;const z=[5,6,7][lvl-1],nS=lvl+2,nT=[0,3,6][lvl-1],E='Usa las flechas para llevar el carrito a las estrellas.',at=(l,p)=>l.some(x=>x[0]==p[0]&&x[1]==p[1]),pt=()=>[rnd(0,z-1),rnd(0,z-1)];let car=[0,0],st=[],tr=[],got=0,won=0;say(E);

const draw=()=>{$('#pb').innerHTML=a.map((x,i)=>`<button class="${i==s?'ok':''}" onclick="sw(${i})">${x}</button>`).join('');if(a.join()==T.join()&&!w){w=1;$('#fb').textContent='🌟 ¡Lo lograste!';stars=Math.min(stars+1,RN());$('#st').textContent=bar();save('puzzle');say('Lo lograste')}};
window.sw=i=>{if(s<0)s=i;else{[a[s],a[i]]=[a[i],a[s]];s=-1}draw()};draw()}
$('#mh').textContent=M;if(SEC)$('#bs').textContent='🏫 Sección '+SEC;show(location.hash.slice(1));
</script></body></html>
